setupVersion: 1
personality: pragmatic
steeringMode: all
includeModelInPrompt: false
textVerbosity: low
extendedContext: false
symbolPreset: ascii
theme:
  dark: graphite

composer:
  shape: pi
statusLine:
  preset: ascii
  separator: ascii
startup:
  quiet: true
  setupWizard: false
display:
  showTokenUsage: true
  cacheMissMarker: true

memory:
  backend: mnemopi
mnemopi:
  enhancedRecall: true
  polyphonicRecall: true
  proactiveLinking: true
  scoping: per-project-tagged
autolearn:
  enabled: true
  autoContinue: true

advisor:
  enabled: true
  syncBacklog: "1"
github:
  enabled: true
bash:
  autoBackground:
    enabled: true
completion:
  notify: "off"
codexResets:
  autoRedeem: "no"
secrets:
  enabled: true
compaction:
  handoffSaveToDisk: true
dev:
  autoqa: false
  autoqaConsent: denied

modelRoles:
  default: openai-codex/gpt-5.6-luna:high
  # Antigravity sends thinkingLevel: MINIMAL for title generation, which 400s.
  tiny: anthropic/claude-haiku-4-5
  commit: google-antigravity/gemini-3.7-flash
  task: openai-codex/gpt-5.6-sol:high
  smol: google-antigravity/gemini-3.7-flash
  advisor: openai-codex/gpt-5.6-terra:high
  plan: openai-codex/gpt-5.6-sol:high
  slow: openai-codex/gpt-5.6-sol:xhigh

task:
  isolation:
    mode: auto
  showResolvedModelBadge: true
  enableLsp: true
  maxEffort: xhigh
  prewalk: true
  agentPrewalk:
    task: google-antigravity/gemini-3.7-flash
  agentAdvisor:
    task: "on"
  agentModelOverrides:
    scout: google-antigravity/gemini-3.7-flash
    librarian: google-antigravity/gemini-3.7-flash
    solver: openai-codex/gpt-5.6-sol:high
    reviewer: openai-codex/gpt-5.6-terra:high
    security-reviewer: openai-codex/gpt-5.6-terra:high
  eager: preferred

providers:
  openai-codex:
    codeMode: auto
  imageOrder:
    - google-antigravity
    - openai-codex
    - anthropic
  tinyModel: lfm2-350m

retry:
  usageAwareFallback: false
  fallbackChains:
    google-antigravity/gemini-3.7-flash:
      - openai-codex/gpt-5.6-luna
      - anthropic/claude-sonnet-5
    openai-codex/gpt-5.6-sol:
      - anthropic/claude-fable-5
      - google-antigravity/gemini-3.7-flash
    openai-codex/gpt-5.6-terra:
      - anthropic/claude-opus-5
    anthropic/claude-fable-5:
      - openai-codex/gpt-5.6-sol
      - google-antigravity/gemini-3.7-flash
    anthropic/claude-haiku-4-5:
      - openai-codex/gpt-5.3-codex-spark
