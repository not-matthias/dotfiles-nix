setupVersion: 2
personality: pragmatic
steeringMode: all
includeModelInPrompt: false
textVerbosity: low
extendedContext: false
symbolPreset: ascii
theme:
  dark: graphite

composer:
  shape: pi
statusLine:
  preset: ascii
  separator: ascii
tui:
  tight: true
display:
  showTokenUsage: true
  cacheMissMarker: true

memory:
  backend: sharpshooter
# Replaced with sharpshooter
# mnemopi:
#   enhancedRecall: true
#   polyphonicRecall: true
#   proactiveLinking: true
#   scoping: per-project-tagged
autolearn:
  enabled: true
  autoContinue: true

advisor:
  enabled: true
github:
  enabled: true
bash:
  autoBackground:
    enabled: true
completion:
  notify: "off"
codexResets:
  autoRedeem: "no"
claudeResets:
  autoRedeem: "no"
ida:
  enabled: true
astGrep:
  enabled: true
tools:
  speculativeExecution:
    enabled: true
secrets:
  enabled: true
compaction:
  handoffSaveToDisk: true
  experimentalContextManagement: true
dev:
  autoqa: false
  autoqaConsent: denied

modelRoles:
  default: openai-codex/gpt-6.1-sol:auto
  tiny: "local/lfm2.5-230m,openai-codex/gpt-5.3-codex-spark"
  commit: google-antigravity/gemini-3.8-flash
  task: openai-codex/gpt-6.1-sol:auto
  smol: google-antigravity/gemini-3.8-flash
  advisor: openai-codex/gpt-6-luna:xhigh
  plan: openai-codex/gpt-6.1-sol:high
  slow: openai-codex/gpt-6.1-sol:high
  image: openai-codex/gpt-image-1

task:
  isolation:
    enabled: true
  showResolvedModelBadge: true
  enableLsp: true
  maxEffort: xhigh
  # Temporarily disabled because prewalk doesn't work with GPT+Google due to encrypted
  # reasoning traces that hide the thinking.
  # prewalk: true
  # agentPrewalk:
  #   task: google-antigravity/gemini-3.8-flash

  # Currently disabled as it increases the context usage quite a lot. I observed up to 50% of total token usage being
  # used up by the advisor. Enable it only if not doing work with lots of subagents.
  # agentAdvisor:
  #   task: "on"
  agentModelOverrides:
    scout: google-antigravity/gemini-3.8-flash
    solver: openai-codex/gpt-6.1-sol:high
    reviewer: openai-codex/gpt-6-luna:xhigh
    security-reviewer: openai-codex/gpt-6-luna:xhigh
  # Currently disabled, as it can increase the cost. Use orchestrate or workflowz instead
  # eager: preferred

retry:
  usageAwareFallback: false
  fallbackChains:
    google-antigravity/gemini-3.8-flash:
      - openai-codex/gpt-5.6-luna
      - anthropic/claude-sonnet-5
    openai-codex/gpt-6.1-sol:
      - anthropic/claude-fable-5
      - google-antigravity/gemini-3.8-flash
    openai-codex/gpt-5.6-terra:
      - anthropic/claude-opus-5
    anthropic/claude-fable-5:
      - openai-codex/gpt-6.1-sol
      - google-antigravity/gemini-3.8-flash
    anthropic/claude-haiku-4-5:
      - openai-codex/gpt-5.6-luna
    image:
      - openai/gpt-image-1
      - google-antigravity/gemini-3-pro-image
      - xai/grok-imagine-image
      - xai-oauth/grok-imagine-image
      - openrouter/google/gemini-3-pro-image-preview
      - google/gemini-3-pro-image-preview
      - deepinfra/black-forest-labs/FLUX-2-pro
