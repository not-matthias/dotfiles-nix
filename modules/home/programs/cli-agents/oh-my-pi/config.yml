setupVersion: 1
personality: pragmatic
steeringMode: all
theme:
  dark: graphite

statusLine:
  preset: ascii
  separator: ascii
startup:
  quiet: true
display:
  showTokenUsage: true
  cacheMissMarker: true

memory:
  backend: mnemopi
mnemopi:
  enhancedRecall: true
  polyphonicRecall: true
  proactiveLinking: true
  scoping: per-project-tagged
autolearn:
  enabled: true
  autoContinue: true

advisor:
  enabled: true
github:
  enabled: true
bash:
  autoBackground:
    enabled: true
completion:
  notify: "off"
codexResets:
  autoRedeem: "no"
dev:
  autoqa: false
  autoqaConsent: denied
tools:
  xdevDocs: catalog

# Do not load slash commands from other agents' config trees.
commands:
  enableClaudeUser: false
  enableClaudeProject: false
  enableOpencodeUser: false
  enableOpencodeProject: false

disabledProviders:
  - claude
disabledExtensions:
  - skill:changelog-writer
  - skill:codspeed-writer
  - skill:commit
  - skill:create-pr
  - skill:linear-plan
  - skill:linear-update
  - skill:frontend-design
  - skill:codspeed
  - skill:codspeed-bench
  - skill:codspeed-instrument-hooks
  - skill:codspeed-memtrack
  - skill:codspeed-notes
  - skill:mac-mini-copy
  - skill:storybook-browser

modelRoles:
  default: google-antigravity/gemini-3.7-flash
  # Antigravity sends thinkingLevel: MINIMAL for title generation, which 400s.
  tiny: anthropic/claude-haiku-4-5
  commit: google-antigravity/gemini-3.7-flash
  task: google-antigravity/gemini-3.7-flash
  smol: google-antigravity/gemini-3.7-flash
  advisor: openai-codex/gpt-5.6-terra:medium
  plan: openai-codex/gpt-5.6-sol:high
  slow: openai-codex/gpt-5.6-sol:xhigh

task:
  showResolvedModelBadge: true
  eager: always
  enableEffort: true
  enableLsp: true
  maxEffort: xhigh
  agentModelOverrides:
    scout: google-antigravity/gemini-3.7-flash
    librarian: google-antigravity/gemini-3.7-flash
    oracle: openai-codex/gpt-5.6-sol:xhigh
    solver: openai-codex/gpt-5.6-sol:xhigh
    reviewer: openai-codex/gpt-5.6-sol:high
    security-reviewer: openai-codex/gpt-5.6-sol:high

providers:
  imageOrder:
    - google-antigravity
    - openai-codex
    - anthropic

retry:
  usageAwareFallback: true
  fallbackChains:
    google-antigravity/gemini-3.7-flash:
      - openai-codex/gpt-5.6-luna
      - anthropic/claude-sonnet-5
    openai-codex/gpt-5.6-sol:
      - anthropic/claude-fable-5
      - google-antigravity/gemini-3.7-flash
    openai-codex/gpt-5.6-terra:
      - anthropic/claude-opus-5
    anthropic/claude-fable-5:
      - openai-codex/gpt-5.6-sol
      - google-antigravity/gemini-3.7-flash
