setupVersion: 1
personality: pragmatic
steeringMode: all
includeModelInPrompt: false
textVerbosity: low
extendedContext: false
symbolPreset: ascii
theme:
  dark: graphite

composer:
  shape: pi
statusLine:
  preset: ascii
  separator: ascii
tui:
  tight: true
startup:
  quiet: true
  setupWizard: false
display:
  showTokenUsage: true
  cacheMissMarker: true

memory:
  backend: sharpshooter
mnemopi:
  enhancedRecall: true
  polyphonicRecall: true
  proactiveLinking: true
  scoping: per-project-tagged
autolearn:
  enabled: true
  autoContinue: true

advisor:
  enabled: true
github:
  enabled: true
bash:
  autoBackground:
    enabled: true
completion:
  notify: "off"
codexResets:
  autoRedeem: "no"
secrets:
  enabled: true
compaction:
  handoffSaveToDisk: true
  experimentalContextManagement: true
dev:
  autoqa: false
  autoqaConsent: denied

modelRoles:
  default: openai-codex/gpt-6-luna:auto
  tiny: openai-codex/gpt-5.3-codex-spark
  commit: google-antigravity/gemini-3.8-flash
  # Only use sol with prewalk, otherwise use:
  # task: openai-codex/gpt-5.6-sol:high
  task: openai-codex/gpt-6-luna:xhigh
  smol: google-antigravity/gemini-3.8-flash
  advisor: google-antigravity/gemini-3.8-flash
  plan: openai-codex/gpt-6-sol:high
  slow: openai-codex/gpt-6-sol:high

task:
  isolation:
    enabled: true
  showResolvedModelBadge: true
  enableLsp: true
  maxEffort: xhigh
  # Temporarily disabled because prewalk doesn't work with GPT+Google due to encrypted
  # reasoning traces that hide the thinking.
  # prewalk: true
  agentPrewalk:
    task: google-antigravity/gemini-3.8-flash

  # Currently disabled as it increases the context usage quite a lot. I observed up to 50% of total token usage being
  # used up by the advisor. Enable it only if not doing work with lots of subagents.
  # agentAdvisor:
  #   task: "on"
  agentModelOverrides:
    scout: google-antigravity/gemini-3.8-flash
    solver: openai-codex/gpt-6-sol:high
    reviewer: openai-codex/gpt-6-luna:xhigh
    security-reviewer: openai-codex/gpt-6-luna:xhigh
  # Currently disabled, as it can increase the cost. Use orchestrate or workflowz instead
  # eager: preferred

providers:
  openai-codex:
    # Currently disabled as it makes GPT models fail at editing because the tool documentation isn't emebedded in the system
    # prompt anymore. This makes models assume it's a patch-based edit tool, when it's actually hashline.
    # codeMode: auto
  imageOrder:
    - google-antigravity
    - openai-codex
    - anthropic
  tinyModel: lfm2.5-230m

retry:
  usageAwareFallback: false
  fallbackChains:
    google-antigravity/gemini-3.8-flash:
      - openai-codex/gpt-5.6-luna
      - anthropic/claude-sonnet-5
    openai-codex/gpt-5.6-sol:
      - anthropic/claude-fable-5
      - google-antigravity/gemini-3.8-flash
    openai-codex/gpt-5.6-terra:
      - anthropic/claude-opus-5
    anthropic/claude-fable-5:
      - openai-codex/gpt-5.6-sol
      - google-antigravity/gemini-3.8-flash
    anthropic/claude-haiku-4-5:
      - openai-codex/gpt-5.6-luna
